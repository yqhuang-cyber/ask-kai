name: POC candidate evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/live/candidate-evaluation-request.json']
permissions:
  contents: read
concurrency:
  group: poc-candidate-evaluation
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [batch-01, batch-02, batch-03, batch-04, batch-05, batch-06, batch-07, batch-08]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Collect explicitly declared candidate
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: node scripts/actions-candidate-evaluation.js ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ matrix.batch }}
          path: |
            .local/candidate-evaluation/candidate.json
            .local/candidate-evaluation/request.json
            .local/candidate-evaluation/failure.json
            .local/candidate-evaluation/observations.json
            .local/candidate-evaluation/collection-report.json
            .local/candidate-evaluation/protocol-diagnostics.json
            .local/candidate-evaluation/scoring-input.json
            .local/candidate-evaluation/judgements.json
            .local/candidate-evaluation/score-report.json
            .local/candidate-evaluation/*/audio-manifest.json
            .local/candidate-evaluation/*/*.pcm
          retention-days: 7
